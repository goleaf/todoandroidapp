name: universal_todo_app
description: Production-ready universal TODO application for iOS, Android, and Web (PWA)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.3.0

  # Database (Drift for SQLite)
  drift: ^2.18.0
  path_provider: ^2.1.2
  path: ^1.9.0
  shared_preferences: ^2.3.2
  http: ^1.2.2
  
  # Models & Serialization
  json_annotation: ^4.9.0

  # Internationalization
  intl: ^0.20.2

  # File handling
  file_picker: ^8.1.4
  share_plus: ^10.1.2
  

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  
  # Code generation
  build_runner: ^2.4.11
  drift_dev: ^2.18.0
  json_serializable: ^6.8.0
  
  # Golden tests
  golden_toolkit: ^0.15.0

flutter:
  generate: true

  uses-material-design: true

