name: universal_todo_server
description: REST API server for the Universal TODO App providing authentication over SQLite.
version: 1.0.0
publish_to: 'none'

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  shelf: ^1.4.1
  shelf_router: ^1.1.4
  sqlite3: ^2.4.3
  path: ^1.9.0
  crypto: ^3.0.3
  uuid: ^4.5.1
  json_annotation: ^4.9.0

dev_dependencies:
  lints: ^3.0.0
